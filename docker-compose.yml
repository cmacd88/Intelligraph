name: intelligraph

services:
  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-2G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-1G}
      # APOC is not required by the schema but you will want it the first
      # time you do a bulk import or run a graph algorithm.
      NEO4J_PLUGINS: '["apoc"]'
      # Required for apoc.load.* procedures.
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    ports:
      # Loopback only — nothing outside this machine can reach the database.
      - "${BIND_ADDR:-127.0.0.1}:${NEO4J_HTTP_PORT:-7474}:7474"
      - "${BIND_ADDR:-127.0.0.1}:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./backups:/backups
    healthcheck:
      # cypher-shell exits non-zero until the database actually accepts
      # queries. A TCP port check reports ready far too early and the
      # init container then fails on connect.
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD} 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks: [intelligraph]

  # Runs once per `up`, applies schema and any unapplied migrations, exits.
  neo4j-init:
    image: neo4j:5-community
    restart: "no"
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      SEED: ${SEED:-0}
    volumes:
      - ./db:/db:ro
    entrypoint: ["bash", "/db/init.sh"]
    networks: [intelligraph]

############

  api:
    build: ./api
    restart: unless-stopped
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      PORT: 4000
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${API_PORT:-4000}:4000"
    depends_on:
      neo4j:
        condition: service_healthy
      neo4j-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [intelligraph]

############

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on: [api]
    networks: [intelligraph]

####


volumes:
  neo4j_data:
  neo4j_logs:

networks:
  intelligraph:
    driver: bridge
