server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript;
    location / { try_files $uri $uri/ /index.html; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    # Written fresh by docker-entrypoint.sh on every container start from
    # this stack's own API_PORT — must never be cached, or a restarted
    # container (e.g. after changing API_PORT) could keep serving a stale
    # port to a browser that cached the old file.
    location = /config.js { add_header Cache-Control "no-cache"; }
}
