<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>IntelliGraph</title>
<style>
:root{
  --bg:#0f172a;--surface:#1e293b;--surface2:#273449;--border:#334155;
  --text:#e2e8f0;--dim:#94a3b8;--faint:#475569;
  --accent:#3b82f6;--danger:#ef4444;--select:#f59e0b;--link:#10b981;--violet:#8b5cf6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
svg#canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
svg#canvas.grabbing{cursor:grabbing}
svg#canvas.linking{cursor:crosshair}

/* ---- top bar ---- */
#top{position:fixed;top:0;left:0;right:0;padding:10px;z-index:10;
  display:flex;gap:8px;pointer-events:none}
#top>*{pointer-events:auto}
#search{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:11px 14px;color:var(--text);font-size:15px;outline:none}
#search:focus{border-color:var(--accent)}
.ib{width:46px;height:46px;flex:none;border:none;border-radius:10px;background:var(--surface);
  border:1px solid var(--border);color:var(--text);font-size:17px;cursor:pointer}
.ib.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-size:24px}
.ib:active{transform:scale(.95)}

#results{position:fixed;top:64px;left:10px;right:10px;z-index:12;background:var(--surface);
  border:1px solid var(--border);border-radius:10px;max-height:45%;overflow-y:auto;display:none}
#results div{padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;
  display:flex;align-items:center;gap:10px}
#results div:last-child{border-bottom:none}
#results div:active{background:var(--surface2)}
.rdot{width:10px;height:10px;border-radius:50%;flex:none}
.rname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtype{font-size:11px;color:var(--dim);flex:none}

#hint{position:fixed;top:64px;left:10px;right:10px;z-index:11;background:var(--surface);
  border-left:3px solid var(--link);border-radius:8px;padding:10px 12px;
  font-size:13px;color:var(--select);display:none}

#status{position:fixed;bottom:10px;left:10px;z-index:10;font-size:12px;color:var(--faint);
  background:var(--surface);padding:6px 10px;border-radius:8px;border:1px solid var(--border)}
#toast{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:var(--danger);
  color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:60;display:none;max-width:92%}

/* ---- panel ---- */
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none}
#sheet{position:fixed;top:0;right:0;bottom:0;z-index:50;width:400px;max-width:100%;
  background:var(--surface);border-left:1px solid var(--border);
  padding:20px 18px 28px;overflow-y:auto;transform:translateX(100%);transition:transform .22s ease;
  box-shadow:-8px 0 24px rgba(0,0,0,.35)}
#sheet.open{transform:translateX(0)}
@media (max-width:640px){
  #sheet{width:100%;left:0}
}
.grab{display:none}
h2{margin:0;font-size:17px}
.sub{color:var(--dim);font-size:13px;margin-top:2px}
label{display:block;font-size:11px;font-weight:700;color:var(--dim);
  text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px}
input[type=text],textarea,select{width:100%;background:var(--bg);border:1px solid var(--border);
  border-radius:10px;padding:10px 12px;color:var(--text);font:15px system-ui,sans-serif;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{height:76px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--border);background:none;color:var(--text);border-radius:20px;
  padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{color:#0f172a}
.row{display:flex;gap:9px;margin-top:16px}

/* ---- dropdown (single-choice, many options) ---- */
.ddwrap{position:relative}
.ddbtn{width:100%;display:flex;align-items:center;gap:9px;background:var(--bg);
  border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);
  font:15px system-ui,sans-serif;cursor:pointer;text-align:left}
.ddbtn:focus,.ddbtn.open{border-color:var(--accent)}
.ddbtn .swatch{width:12px;height:12px;border-radius:50%;flex:none}
.ddbtn .ddlabel{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ddbtn .ddcaret{color:var(--dim);font-size:11px;flex:none}
.ddlist{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:55;
  background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  max-height:220px;overflow-y:auto;display:none;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.ddlist.open{display:block}
.ddopt{display:flex;align-items:center;gap:9px;padding:9px 12px;cursor:pointer;font-size:14px}
.ddopt:hover,.ddopt.hi{background:var(--border)}
.ddopt.sel{font-weight:700}
.ddopt .swatch{width:11px;height:11px;border-radius:50%;flex:none}
.btn{flex:1;border:none;border-radius:10px;padding:13px;color:#fff;font-size:15px;
  font-weight:700;cursor:pointer;background:var(--accent)}
.btn.danger{background:var(--danger)}
.btn.ghost{background:var(--border)}
.btn.violet{background:var(--violet)}
.btn.small{padding:10px;font-size:13px}
.prop{font-size:14px;margin-top:5px;word-break:break-word}
.prop b{color:var(--dim);font-weight:400}
.head{display:flex;align-items:center;gap:10px}
.dot{width:15px;height:15px;border-radius:50%;flex:none}
.conf{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;
  text-transform:uppercase;letter-spacing:.4px;margin-left:6px}
.conf.confirmed{background:#065f46;color:#6ee7b7}
.conf.probable{background:#78350f;color:#fcd34d}
.conf.unconfirmed{background:#3f3f46;color:#d4d4d8}
.split{display:flex;gap:9px}
.split>*{flex:1}
.mini{font-size:12px;color:var(--dim);margin-top:10px}
.linkbtn{background:none;border:none;color:var(--accent);font-size:13px;cursor:pointer;
  padding:0;margin-top:12px;text-decoration:underline}
</style>
</head>
<body>

<svg id="canvas"></svg>

<div id="top">
  <input id="search" type="text" placeholder="Search…" autocomplete="off">
  <button class="ib" id="b-fit" title="Fit">⤢</button>
  <button class="ib" id="b-menu" title="Menu">☰</button>
  <button class="ib primary" id="b-add" title="Add">+</button>
</div>

<div id="results"></div>
<div id="hint"></div>
<div id="status">connecting…</div>
<div id="toast"></div>

<div id="backdrop"></div>
<div id="sheet"><div class="grab"></div><div id="body"></div></div>

<script>
'use strict';

// API is same-origin when proxied, else port 4000 on whatever host served this.
const API = window.__API_URL__ || `${location.protocol}//${location.hostname}:4000`;

const NS='http://www.w3.org/2000/svg';
const R=26, HIT=R+16;
const CONFIDENCE=['confirmed','probable','unconfirmed'];

let nodes=[], edges=[], sources=[];
let etypes=new Map(), rtypes=new Map();
let cam={x:0,y:0,k:1};
let sel=null, linkFrom=null, pathFrom=null;
let hidden=new Set();          // entity types toggled off
let showLabels=true;
let focusUid=null, focusDepth=0;   // N-degree-of-separation filter (0 = off)
let collapsed=new Set();       // uids of nodes whose off-side subtree is folded

const $=id=>document.getElementById(id);
const svg=$('canvas'), sheet=$('sheet'), body=$('body'),
      backdrop=$('backdrop'), hintEl=$('hint'), statusEl=$('status'),
      toastEl=$('toast'), resultsEl=$('results');

const byUid=u=>nodes.find(n=>n.uid===u);
const degree=u=>edges.filter(e=>e.from===u||e.to===u).length;
const tstyle=t=>etypes.get(t)||{color:'#6b7280',glyph:'??',icon:''};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------------------------------------------------------------- api

async function req(path,opts){
  const res=await fetch(API+path,{...opts,
    headers:{'Content-Type':'application/json',...(opts&&opts.headers)}});
  if(!res.ok){
    let msg=res.status;
    try{ msg=(await res.json()).error||msg; }catch{}
    throw new Error(msg);
  }
  return res.status===204?null:res.json();
}

function toast(m){
  toastEl.textContent=m; toastEl.style.display='block';
  clearTimeout(toast._t); toast._t=setTimeout(()=>toastEl.style.display='none',4500);
}

function setStatus(){
  const vis=visible().n.length;
  const bits=[];
  if(hidden.size) bits.push(`${hidden.size} type${hidden.size>1?'s':''} hidden`);
  if(focusUid&&focusDepth>0) bits.push(`${focusDepth}° focus`);
  if(collapsed.size) bits.push(`${collapsed.size} collapsed`);
  const extra=bits.length?` · ${bits.join(' · ')}`:'';
  statusEl.textContent=`${vis}/${nodes.length} entities · ${edges.length} links${extra}`;
}

async function boot(){
  try{
    const t=await req('/types');
    etypes=new Map(t.entities.map(x=>[x.name,x]));
    rtypes=new Map(t.relationships.map(x=>[x.name,x]));
  }catch(e){
    statusEl.textContent='API unreachable';
    toast(`Cannot reach API at ${API}`);
    return;
  }
  await loadGraph();
  loadSources();
}

async function loadGraph(){
  try{
    const g=await req('/graph');
    nodes=g.nodes; edges=g.edges;
    fit(); render(); setStatus();
  }catch(e){ toast('Load failed: '+e.message); }
}

async function loadSources(){
  try{ sources=await req('/sources'); }catch{ sources=[]; }
}

// ---------------------------------------------------------------- render

const el=(tag,attrs)=>{
  const n=document.createElementNS(NS,tag);
  for(const k in attrs) n.setAttribute(k,attrs[k]);
  return n;
};

// BFS hop-distance from `uid` over the full (untyped-filtered) graph.
// Returns Map<uid, hops>. uid itself is hop 0.
function bfsDepths(uid){
  const adj=new Map();
  for(const e of edges){
    if(!adj.has(e.from)) adj.set(e.from,[]);
    if(!adj.has(e.to)) adj.set(e.to,[]);
    adj.get(e.from).push(e.to);
    adj.get(e.to).push(e.from);
  }
  const dist=new Map([[uid,0]]);
  const q=[uid];
  while(q.length){
    const cur=q.shift(), d=dist.get(cur);
    for(const nb of adj.get(cur)||[]){
      if(!dist.has(nb)){ dist.set(nb,d+1); q.push(nb); }
    }
  }
  return dist;
}

// Connected components of the visible graph, optionally with one node
// removed. Returns Map<uid, componentIndex>.
function components(n,e,without){
  const adj=new Map();
  for(const x of n) if(x.uid!==without) adj.set(x.uid,[]);
  for(const edge of e){
    if(edge.from===without||edge.to===without) continue;
    if(!adj.has(edge.from)||!adj.has(edge.to)) continue;
    adj.get(edge.from).push(edge.to);
    adj.get(edge.to).push(edge.from);
  }
  const comp=new Map();
  let ci=0;
  for(const uid of adj.keys()){
    if(comp.has(uid)) continue;
    const q=[uid]; comp.set(uid,ci);
    while(q.length){
      const cur=q.shift();
      for(const nb of adj.get(cur)||[]) if(!comp.has(nb)){ comp.set(nb,ci); q.push(nb); }
    }
    ci++;
  }
  return comp;
}

// The visible node/edge set after type and N-degree filtering, but before
// collapse is applied — the graph collapse eligibility and folding both
// reason about.
function preCollapseGraph(){
  let n=nodes.filter(x=>!hidden.has(x.type));
  let ids=new Set(n.map(x=>x.uid));
  let e=edges.filter(x=>ids.has(x.from)&&ids.has(x.to));

  if(focusUid&&focusDepth>0){
    const dist=bfsDepths(focusUid);
    n=n.filter(x=>(dist.get(x.uid)??Infinity)<=focusDepth);
    ids=new Set(n.map(x=>x.uid));
    e=e.filter(x=>ids.has(x.from)&&ids.has(x.to));
  }
  return {n,e};
}

// A node can only be collapsed if it's a true pendant point: removing it
// splits the graph into exactly the "rest of the graph" plus one dangling
// side. A branching hub (removal splits into 3+ pieces) is left alone —
// there's no way to tell which branch to keep without a "came from"
// direction, so collapse is restricted to unambiguous cases only.
function pendantInfo(uid){
  const {n,e}=preCollapseGraph();
  const comp=components(n,e,uid);
  const sizes=new Map();
  for(const ci of comp.values()) sizes.set(ci,(sizes.get(ci)||0)+1);
  if(sizes.size===0) return {ok:false,reason:'isolated'};
  if(sizes.size===1) return {ok:false,reason:'leaf'};        // nothing past it
  if(sizes.size>2) return {ok:false,reason:'hub'};            // ambiguous branch point
  const [[,a],[,b]]=[...sizes.entries()];
  return {ok:true,count:Math.min(a,b)};
}

// BloodHound-style fold: hides the dangling side of each collapsed pendant
// point and replaces it with a single "+N" badge attached to that node.
function collapseView(n,e){
  if(!collapsed.size) return {n,e,badges:[]};

  const hiddenUids=new Set();
  const badges=[];

  for(const foldUid of collapsed.keys()){
    const root=byUid(foldUid);
    if(!root || hiddenUids.has(foldUid)) continue;

    const comp=components(n,e,foldUid);
    const sizes=new Map();
    for(const ci of comp.values()) sizes.set(ci,(sizes.get(ci)||0)+1);
    if(sizes.size!==2) continue; // no longer a clean pendant (graph changed) — skip rather than guess
    let mainCi=null, mainSize=-1;
    for(const [ci,sz] of sizes) if(sz>mainSize){ mainSize=sz; mainCi=ci; }

    let count=0;
    for(const [uid,ci] of comp){
      if(ci===mainCi) continue;
      hiddenUids.add(uid); count++;
    }
    if(count>0) badges.push({parent:root,count});
  }

  const n2=n.filter(x=>!hiddenUids.has(x.uid));
  const ids=new Set(n2.map(x=>x.uid));
  const e2=e.filter(x=>ids.has(x.from)&&ids.has(x.to));
  return {n:n2,e:e2,badges};
}

function visible(){
  const {n,e}=preCollapseGraph();
  const {n:n3,e:e3,badges}=collapseView(n,e);
  return {n:n3, e:e3, badges};
}

function render(){
  svg.textContent='';

  const defs=el('defs');
  defs.innerHTML=`<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrowSel" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>`;
  svg.appendChild(defs);

  const g=el('g',{transform:`translate(${cam.x},${cam.y}) scale(${cam.k})`});
  const {n:vn,e:ve,badges}=visible();
  const idx=new Map(vn.map(n=>[n.uid,n]));

  // Group edges by unordered node pair so multiple links between the same
  // two entities (e.g. several transactions) fan out into separate arcs
  // instead of drawing exactly on top of each other.
  const pairKey=e=>e.from<e.to?`${e.from}|${e.to}`:`${e.to}|${e.from}`;
  const pairs=new Map();
  for(const e of ve){
    const k=pairKey(e);
    if(!pairs.has(k)) pairs.set(k,[]);
    pairs.get(k).push(e);
  }

  // confidence -> [opacity, extra stroke width, dash]
  const CONF_STYLE={
    confirmed:  [1,    0,   null],
    probable:   [.6,   0,   null],
    unconfirmed:[.6,   0,   '5,4'],
  };

  for(const [,group] of pairs){
    const n=group.length;
    group.forEach((e,i)=>{
      const a=idx.get(e.from), b=idx.get(e.to);
      if(!a||!b) return;
      const on=sel&&sel.kind==='edge'&&sel.id===e.id;
      const rt=rtypes.get(e.type)||{};
      const directed=rt.directed!==false;
      const baseColor=rt.color||'#475569';
      const [opacity,,dash]=CONF_STYLE[e.confidence]||CONF_STYLE.unconfirmed;

      const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||1;
      const ux=dx/len, uy=dy/len;
      // perpendicular offset for this edge within its group, spread evenly
      // around the straight line (0 offset when there's only one edge)
      const spread=14;
      const off=n>1?(i-(n-1)/2)*spread:0;
      const px=-uy*off, py=ux*off;

      const mx=(a.x+b.x)/2+px, my=(a.y+b.y)/2+py;

      // Pull the endpoint back so the arrowhead clears the node. For a
      // curved edge, "back" means back along the curve's own tangent near
      // b (control point -> b), not the straight a->b direction, or the
      // line would visibly clip into the node circle.
      const tx=b.x-mx, ty=b.y-my, tlen=Math.hypot(tx,ty)||1;
      const bux=off?tx/tlen:ux, buy=off?ty/tlen:uy;
      const x2=b.x-bux*(R+3), y2=b.y-buy*(R+3);

      const path=off
        ? `M${a.x},${a.y} Q${mx},${my} ${x2},${y2}`
        : `M${a.x},${a.y} L${x2},${y2}`;

      const line=el('path',{d:path,fill:'none',
        stroke:on?'var(--select)':baseColor,
        'stroke-width':on?3:1.5,
        opacity:on?1:opacity});
      if(directed) line.setAttribute('marker-end',on?'url(#arrowSel)':'url(#arrow)');
      if(dash) line.setAttribute('stroke-dasharray',dash);
      g.appendChild(line);

      const hitpath=off
        ? `M${a.x},${a.y} Q${mx},${my} ${b.x},${b.y}`
        : `M${a.x},${a.y} L${b.x},${b.y}`;
      const hitline=el('path',{d:hitpath,fill:'none',
        stroke:'transparent','stroke-width':18,style:'cursor:pointer'});
      hitline.addEventListener('pointerdown',ev=>{
        ev.stopPropagation(); sel={kind:'edge',id:e.id}; render(); openEdge(e);
      });
      g.appendChild(hitline);

      const t=el('text',{x:mx,y:my-7,'text-anchor':'middle',
        fill:on?'var(--select)':'#64748b','font-size':10,'font-weight':600,
        style:'pointer-events:none;user-select:none'});
      t.textContent=e.type;
      g.appendChild(t);
    });
  }

  for(const n of vn){
    const st=tstyle(n.type);
    const on=sel&&sel.kind==='node'&&sel.id===n.uid;
    const src=linkFrom===n.uid||pathFrom===n.uid;
    const grp=el('g',{style:'cursor:grab'});

    if(on||src) grp.appendChild(el('circle',{cx:n.x,cy:n.y,r:R+5,fill:'none',
      stroke:src?'var(--link)':'var(--select)','stroke-width':3}));

    grp.appendChild(el('circle',{cx:n.x,cy:n.y,r:R,fill:st.color}));

    const gl=el('text',{x:n.x,y:n.y+5,'text-anchor':'middle',
      'font-size':st.icon?16:14,
      'font-weight':700,fill:'#0f172a',
      style:'pointer-events:none;user-select:none'});
    gl.textContent=st.icon||st.glyph;
    grp.appendChild(gl);

    if(showLabels){
      const lb=el('text',{x:n.x,y:n.y+R+16,'text-anchor':'middle','font-size':12,
        'font-weight':600,fill:'var(--text)',style:'pointer-events:none;user-select:none'});
      lb.textContent=n.name.length>22?n.name.slice(0,21)+'…':n.name;
      grp.appendChild(lb);
    }

    if(collapsed.has(n.uid)){
      grp.appendChild(el('circle',{cx:n.x+R-6,cy:n.y-R+6,r:7,fill:'var(--select)'}));
      const fm=el('text',{x:n.x+R-6,y:n.y-R+9,'text-anchor':'middle','font-size':10,
        'font-weight':700,fill:'#0f172a',style:'pointer-events:none;user-select:none'});
      fm.textContent='−';
      grp.appendChild(fm);
    }

    g.appendChild(grp);
  }

  // collapsed-subtree badges: a small ring node offset from its parent
  for(const b of badges){
    const bx=b.parent.x+R+34, by=b.parent.y+R+34;
    const bg=el('g',{style:'cursor:pointer'});
    bg.appendChild(el('line',{x1:b.parent.x,y1:b.parent.y,x2:bx,y2:by,
      stroke:'var(--faint)','stroke-width':1.5,'stroke-dasharray':'3,4'}));
    bg.appendChild(el('circle',{cx:bx,cy:by,r:18,fill:'var(--surface2)',
      stroke:'var(--select)','stroke-width':2}));
    const bt=el('text',{x:bx,y:by+4,'text-anchor':'middle','font-size':12,
      'font-weight':700,fill:'var(--select)',style:'pointer-events:none;user-select:none'});
    bt.textContent='+'+b.count;
    bg.appendChild(bt);
    bg.addEventListener('pointerdown',ev=>{
      ev.stopPropagation();
      collapsed.delete(b.parent.uid);
      render(); setStatus();
    });
    g.appendChild(bg);
  }

  svg.appendChild(g);
}

function fit(){
  const {n:vn}=visible();
  if(!vn.length) return;
  const xs=vn.map(n=>n.x), ys=vn.map(n=>n.y);
  const minX=Math.min(...xs)-90, maxX=Math.max(...xs)+90;
  const minY=Math.min(...ys)-90, maxY=Math.max(...ys)+90;
  const w=svg.clientWidth, h=svg.clientHeight;
  cam.k=Math.min(w/Math.max(maxX-minX,1),h/Math.max(maxY-minY,1),1.5);
  cam.x=w/2-((minX+maxX)/2)*cam.k;
  cam.y=h/2-((minY+maxY)/2)*cam.k;
}

// ---------------------------------------------------------------- input

const toGraph=(sx,sy)=>({x:(sx-cam.x)/cam.k,y:(sy-cam.y)/cam.k});

function hit(sx,sy){
  const p=toGraph(sx,sy);
  const {n:vn}=visible();
  for(let i=vn.length-1;i>=0;i--){
    const n=vn[i], dx=p.x-n.x, dy=p.y-n.y;
    if(dx*dx+dy*dy<=HIT*HIT) return n;
  }
  return null;
}

const pointers=new Map();
let drag=null, panning=null, pinch=null, moved=false, pressTimer=null;

svg.addEventListener('pointerdown',ev=>{
  svg.setPointerCapture(ev.pointerId);
  pointers.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  moved=false;
  hideResults();

  if(pointers.size===2){
    const [a,b]=[...pointers.values()];
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:cam.k,
      cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,camx:cam.x,camy:cam.y};
    drag=panning=null; clearTimeout(pressTimer); return;
  }

  const n=hit(ev.clientX,ev.clientY);
  if(n){
    sel={kind:'node',id:n.uid};
    const p=toGraph(ev.clientX,ev.clientY);
    drag={uid:n.uid,dx:p.x-n.x,dy:p.y-n.y,x0:n.x,y0:n.y};
    pressTimer=setTimeout(()=>{ if(!moved){drag=null; openEdit(byUid(n.uid));} },500);
    render();
  }else{
    panning={x:ev.clientX,y:ev.clientY,camx:cam.x,camy:cam.y};
    svg.classList.add('grabbing');
  }
});

svg.addEventListener('pointermove',ev=>{
  if(!pointers.has(ev.pointerId)) return;
  pointers.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});

  if(pinch&&pointers.size===2){
    const [a,b]=[...pointers.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    const k=Math.max(.15,Math.min(4,pinch.k*(d/pinch.d)));
    const r=k/pinch.k;
    cam.k=k;
    cam.x=pinch.cx-(pinch.cx-pinch.camx)*r;
    cam.y=pinch.cy-(pinch.cy-pinch.camy)*r;
    render(); return;
  }

  if(drag){
    const p=toGraph(ev.clientX,ev.clientY);
    const n=byUid(drag.uid);
    if(n){
      const nx=p.x-drag.dx, ny=p.y-drag.dy;
      if(Math.hypot(nx-drag.x0,ny-drag.y0)>3) moved=true;
      n.x=nx; n.y=ny; render();
    }
  }else if(panning){
    const dx=ev.clientX-panning.x, dy=ev.clientY-panning.y;
    if(Math.hypot(dx,dy)>3) moved=true;
    cam.x=panning.camx+dx; cam.y=panning.camy+dy;
    render();
  }
});

function endPointer(ev){
  clearTimeout(pressTimer);
  pointers.delete(ev.pointerId);
  svg.classList.remove('grabbing');
  if(pointers.size<2) pinch=null;

  if(drag){
    const n=byUid(drag.uid);
    if(moved&&n){
      req(`/entities/${n.uid}`,{method:'PATCH',
        body:JSON.stringify({x:Math.round(n.x),y:Math.round(n.y)})})
        .catch(()=>toast('Position not saved'));
    }else if(!moved&&n){ onTapNode(n); }
    drag=null;
  }else if(panning){
    if(!moved) onTapBackground();
    panning=null;
  }
}
svg.addEventListener('pointerup',endPointer);
svg.addEventListener('pointercancel',endPointer);

svg.addEventListener('wheel',ev=>{
  ev.preventDefault();
  const k=Math.max(.15,Math.min(4,cam.k*(ev.deltaY<0?1.12:1/1.12)));
  const r=k/cam.k;
  cam.x=ev.clientX-(ev.clientX-cam.x)*r;
  cam.y=ev.clientY-(ev.clientY-cam.y)*r;
  cam.k=k; render();
},{passive:false});

function onTapNode(n){
  if(linkFrom&&linkFrom!==n.uid){
    const from=byUid(linkFrom);
    linkFrom=null; hintEl.style.display='none'; svg.classList.remove('linking');
    openLink(from,n); return;
  }
  if(pathFrom&&pathFrom!==n.uid){
    const from=pathFrom;
    pathFrom=null; hintEl.style.display='none'; svg.classList.remove('linking');
    findPath(from,n.uid); return;
  }
  openInspect(n);
}

function onTapBackground(){
  sel=null;
  if(linkFrom||pathFrom){
    linkFrom=pathFrom=null;
    hintEl.style.display='none';
    svg.classList.remove('linking');
  }
  closeSheet(); render();
}

// ---------------------------------------------------------------- search

let searchTimer=null;
$('search').addEventListener('input',ev=>{
  const q=ev.target.value.trim();
  clearTimeout(searchTimer);
  if(!q){ hideResults(); return; }
  searchTimer=setTimeout(()=>doSearch(q),220);
});

async function doSearch(q){
  try{
    const hits=await req(`/graph/search?q=${encodeURIComponent(q)}`);
    if(!hits.length){ hideResults(); return; }
    resultsEl.innerHTML=hits.map(h=>
      `<div data-uid="${h.uid}">
        <span class="rdot" style="background:${tstyle(h.type).color}"></span>
        <span class="rname">${esc(h.name)}</span>
        <span class="rtype">${esc(h.type)}</span>
      </div>`).join('');
    resultsEl.style.display='block';
    resultsEl.querySelectorAll('div[data-uid]').forEach(d=>{
      d.onclick=()=>{ focusNode(d.dataset.uid); hideResults(); $('search').value=''; };
    });
  }catch(e){ toast('Search failed: '+e.message); }
}

const hideResults=()=>resultsEl.style.display='none';

async function focusNode(uid){
  let n=byUid(uid);
  if(!n){
    // hit is outside the loaded set — pull it and its neighbourhood in
    try{
      const sub=await req(`/graph/neighbors/${uid}`);
      const e=await req(`/entities/${uid}`);
      mergeSub({nodes:[e,...sub.nodes],edges:sub.edges});
      n=byUid(uid);
    }catch(err){ toast('Could not load entity'); return; }
  }
  if(!n) return;
  cam.k=1.1;
  cam.x=svg.clientWidth/2-n.x*cam.k;
  cam.y=svg.clientHeight/2-n.y*cam.k;
  sel={kind:'node',id:n.uid};
  render(); setStatus(); openInspect(n);
}

function mergeSub(sub){
  const known=new Set(nodes.map(n=>n.uid));
  for(const n of sub.nodes) if(!known.has(n.uid)){ nodes.push(n); known.add(n.uid); }
  const ke=new Set(edges.map(e=>e.id));
  for(const e of sub.edges) if(!ke.has(e.id)) edges.push(e);
}

// ---------------------------------------------------------------- sheet

function openSheet(html){
  body.innerHTML=html;
  sheet.classList.add('open');
  backdrop.style.display='block';
}
function closeSheet(){
  sheet.classList.remove('open');
  backdrop.style.display='none';
}
backdrop.onclick=closeSheet;

const parseProps=s=>{
  const o={};
  for(const line of s.split('\n')){
    const i=line.indexOf(':');
    if(i>0) o[line.slice(0,i).trim()]=line.slice(i+1).trim();
  }
  return o;
};
const printProps=p=>Object.entries(p||{}).map(([k,v])=>`${k}: ${v}`).join('\n');

const confChips=s=>CONFIDENCE.map(c=>
  `<button class="chip ${c===s?'on':''}" data-v="${c}"
    style="border-color:var(--faint)${c===s?';background:var(--faint);color:#e2e8f0':''}">${c}</button>`
  ).join('');

function wireChips(sel,cb){
  const box=body.querySelector(sel);
  if(!box) return;
  box.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    box.querySelectorAll('.chip').forEach(x=>{
      x.classList.remove('on');
      x.style.background='none';
      if(box.dataset.kind==='conf') x.style.color='var(--text)';
    });
    c.classList.add('on');
    c.style.background=c.style.borderColor;
    cb(c.dataset.v);
  });
}

// ---- scrollable single-choice dropdown, confined to the panel ----
// opts: [{value, label, color?}]  — used for entity/relationship type pickers
function dropdownHTML(id,opts,selected){
  const sel=opts.find(o=>o.value===selected)||opts[0]||{value:'',label:'—'};
  const rows=opts.map(o=>
    `<div class="ddopt ${o.value===sel.value?'sel':''}" data-v="${esc(o.value)}">
      ${o.color?`<span class="swatch" style="background:${o.color}"></span>`:''}
      <span>${esc(o.label)}</span>
    </div>`).join('');
  return `<div class="ddwrap" id="${id}" data-value="${esc(sel.value)}">
    <button type="button" class="ddbtn">
      ${sel.color?`<span class="swatch" style="background:${sel.color}"></span>`:''}
      <span class="ddlabel">${esc(sel.label)}</span>
      <span class="ddcaret">▾</span>
    </button>
    <div class="ddlist">${rows}</div>
  </div>`;
}

function wireDropdown(id,cb){
  const wrap=body.querySelector('#'+id);
  if(!wrap) return;
  const btn=wrap.querySelector('.ddbtn'), list=wrap.querySelector('.ddlist');
  const close=()=>{ list.classList.remove('open'); btn.classList.remove('open'); };
  const open=()=>{
    document.querySelectorAll('.ddlist.open').forEach(l=>l!==list&&l.classList.remove('open'));
    list.classList.add('open'); btn.classList.add('open');
  };
  btn.onclick=ev=>{ ev.stopPropagation(); list.classList.contains('open')?close():open(); };
  list.querySelectorAll('.ddopt').forEach(opt=>opt.onclick=ev=>{
    ev.stopPropagation();
    const v=opt.dataset.v;
    wrap.dataset.value=v;
    list.querySelectorAll('.ddopt').forEach(o=>o.classList.toggle('sel',o===opt));
    btn.querySelector('.ddlabel').textContent=opt.querySelector('span:last-child').textContent;
    const sw=opt.querySelector('.swatch'), btnSw=btn.querySelector('.swatch');
    if(sw&&btnSw) btnSw.style.background=sw.style.background;
    close();
    cb(v);
  });
}
document.addEventListener('click',()=>{
  document.querySelectorAll('.ddlist.open').forEach(l=>l.classList.remove('open'));
  document.querySelectorAll('.ddbtn.open').forEach(b=>b.classList.remove('open'));
});

const sourceOptions=s=>
  `<option value="">— none —</option>`+
  sources.map(x=>`<option value="${x.uid}"${x.uid===s?' selected':''}>${esc(x.label)}</option>`).join('');

// ---- inspect ----
function openInspect(n){
  const st=tstyle(n.type);
  const props=Object.entries(n.props||{})
    .map(([k,v])=>`<div class="prop"><b>${esc(k)}:</b> ${esc(v)}</div>`).join('');
  const notes=n.notes?`<div class="prop" style="margin-top:10px">${esc(n.notes)}</div>`:'';

  openSheet(`
    <div class="head">
      <div class="dot" style="background:${st.color}"></div>
      <div style="flex:1;min-width:0">
        <h2>${esc(n.name)}</h2>
        <div class="sub">${esc(n.type)} · ${degree(n.uid)} link${degree(n.uid)===1?'':'s'}</div>
      </div>
    </div>
    ${props}${notes}
    <div class="row">
      <button class="btn small" id="a-exp">Expand</button>
      <button class="btn violet small" id="a-link">Link</button>
      <button class="btn ghost small" id="a-edit">Edit</button>
    </div>
    <div class="row">
      <button class="btn ghost small" id="a-path">Find path from here</button>
      <button class="btn ghost small" id="a-hide">Hide</button>
    </div>
    <div class="row">
      <button class="btn ghost small" id="a-fold">${collapsed.has(n.uid)?'Uncollapse'
        :(pendantInfo(n.uid).ok?`Collapse (${pendantInfo(n.uid).count})`:'Collapse')}</button>
    </div>
    <label>Degrees of separation ${focusUid===n.uid&&focusDepth>0?`<button class="linkbtn" id="a-unfocus" style="margin:0 0 0 8px">clear</button>`:''}</label>
    <div class="chips" id="c-deg" data-kind="conf">
      ${[1,2,3,4].map(d=>`<button class="chip ${focusUid===n.uid&&focusDepth===d?'on':''}" data-v="${d}"
        style="border-color:var(--faint)${focusUid===n.uid&&focusDepth===d?';background:var(--faint);color:#e2e8f0':''}">${d}</button>`).join('')}
    </div>`);

  body.querySelector('#a-exp').onclick=async()=>{
    try{
      const sub=await req(`/graph/neighbors/${n.uid}`);
      const before=nodes.length;
      const known=new Set(nodes.map(x=>x.uid));
      const fresh=sub.nodes.filter(x=>!known.has(x.uid));
      fresh.forEach((x,i)=>{
        const a=2*Math.PI*i/Math.max(fresh.length,1);
        x.x=n.x+Math.cos(a)*160; x.y=n.y+Math.sin(a)*160;
      });
      mergeSub({nodes:fresh,edges:sub.edges});
      closeSheet(); render(); setStatus();
      if(nodes.length===before) toast('No new connections');
    }catch(e){ toast('Expand failed: '+e.message); }
  };

  body.querySelector('#a-link').onclick=()=>{
    linkFrom=n.uid;
    hintEl.textContent=`Tap a target to link from ${n.name} — tap empty space to cancel`;
    hintEl.style.display='block';
    svg.classList.add('linking');
    closeSheet(); render();
  };

  body.querySelector('#a-path').onclick=()=>{
    pathFrom=n.uid;
    hintEl.textContent=`Tap a second entity to find the path from ${n.name}`;
    hintEl.style.display='block';
    svg.classList.add('linking');
    closeSheet(); render();
  };

  body.querySelector('#a-hide').onclick=()=>{
    hidden.add(n.type); closeSheet(); render(); setStatus();
    toast(`${n.type} hidden — reopen from ☰`);
  };

  body.querySelector('#a-edit').onclick=()=>openEdit(n);

  body.querySelector('#a-fold').onclick=()=>{
    if(collapsed.has(n.uid)){
      collapsed.delete(n.uid); closeSheet(); render(); setStatus(); return;
    }
    const info=pendantInfo(n.uid);
    if(!info.ok){
      const why={leaf:'nothing past this node to collapse',
        isolated:'this node has no visible connections',
        hub:'this node branches — collapse only works on a single dangling chain'}[info.reason];
      toast(`Can't collapse: ${why}`);
      return;
    }
    collapsed.add(n.uid); closeSheet(); render(); setStatus();
  };

  wireChips('#c-deg',v=>{
    focusUid=n.uid; focusDepth=parseInt(v,10);
    closeSheet(); render(); setStatus();
  });
  const unfocusBtn=body.querySelector('#a-unfocus');
  if(unfocusBtn) unfocusBtn.onclick=()=>{
    focusUid=null; focusDepth=0; closeSheet(); render(); setStatus();
  };
}

// ---- create ----
function openCreate(){
  let type=[...etypes.keys()][0]||'Person';
  openSheet(`
    <h2>New entity</h2>
    <label>Name</label>
    <input type="text" id="f-name" placeholder="e.g. Alice Nordmann">
    <label>Type <button class="linkbtn" id="a-newtype" style="margin:0 0 0 8px">+ new type</button></label>
    ${dropdownHTML('c-type',[...etypes.values()].map(t=>({value:t.name,label:t.name,color:t.color})),type)}
    <label>Properties (key: value per line)</label>
    <textarea id="f-props" placeholder="role: Engineer&#10;country: NO"></textarea>
    <label>Notes</label>
    <textarea id="f-notes" style="height:56px"></textarea>
    <label>Source</label>
    <select id="f-source">${sourceOptions()}</select>
    <div class="row">
      <button class="btn" id="a-save">Create</button>
      <button class="btn ghost" id="a-cancel">Cancel</button>
    </div>`);

  wireDropdown('c-type',v=>type=v);
  body.querySelector('#a-cancel').onclick=closeSheet;
  body.querySelector('#a-newtype').onclick=()=>openNewType(()=>openCreate());

  body.querySelector('#a-save').onclick=async()=>{
    const name=body.querySelector('#f-name').value.trim();
    if(!name){ toast('Name required'); return; }
    const c=toGraph(svg.clientWidth/2,svg.clientHeight/2);
    try{
      const n=await req('/entities',{method:'POST',body:JSON.stringify({
        name,type,
        props:parseProps(body.querySelector('#f-props').value),
        notes:body.querySelector('#f-notes').value,
        source_uid:body.querySelector('#f-source').value||null,
        x:Math.round(c.x),y:Math.round(c.y),
      })});
      nodes.push(n); closeSheet(); render(); setStatus();
    }catch(e){ toast('Create failed: '+e.message); }
  };
}

// ---- edit ----
function openEdit(n){
  if(!n) return;
  let type=n.type;
  openSheet(`
    <h2>Edit entity</h2>
    <label>Name</label>
    <input type="text" id="f-name" value="${esc(n.name)}">
    <label>Type</label>
    ${dropdownHTML('c-type',[...etypes.values()].map(t=>({value:t.name,label:t.name,color:t.color})),type)}
    <label>Properties</label>
    <textarea id="f-props">${esc(printProps(n.props))}</textarea>
    <label>Notes</label>
    <textarea id="f-notes" style="height:56px">${esc(n.notes)}</textarea>
    <div class="row">
      <button class="btn" id="a-save">Save</button>
      <button class="btn danger" id="a-del">Delete</button>
    </div>
    <div class="mini">Created ${esc((n.created||'').slice(0,10))}</div>`);

  wireDropdown('c-type',v=>type=v);

  body.querySelector('#a-save').onclick=async()=>{
    const name=body.querySelector('#f-name').value.trim();
    if(!name){ toast('Name required'); return; }
    try{
      // type change rewrites the label, so it is a separate endpoint
      if(type!==n.type) await req(`/entities/${n.uid}/type`,
        {method:'PUT',body:JSON.stringify({type})});
      const u=await req(`/entities/${n.uid}`,{method:'PATCH',body:JSON.stringify({
        name,
        props:parseProps(body.querySelector('#f-props').value),
        notes:body.querySelector('#f-notes').value,
      })});
      Object.assign(n,u,{type});
      closeSheet(); render(); setStatus();
    }catch(e){ toast('Save failed: '+e.message); }
  };

  body.querySelector('#a-del').onclick=async()=>{
    try{
      await req(`/entities/${n.uid}`,{method:'DELETE'});
      nodes=nodes.filter(x=>x.uid!==n.uid);
      edges=edges.filter(e=>e.from!==n.uid&&e.to!==n.uid);
      collapsed.delete(n.uid);
      if(focusUid===n.uid){ focusUid=null; focusDepth=0; }
      sel=null; closeSheet(); render(); setStatus();
    }catch(e){ toast('Delete failed: '+e.message); }
  };
}

// ---- link ----
function openLink(from,to){
  if(!from||!to) return;
  let rel=[...rtypes.keys()][0], conf='unconfirmed';
  openSheet(`
    <h2>New relationship</h2>
    <div class="sub">${esc(from.name)} → ${esc(to.name)}</div>
    <label>Type <button class="linkbtn" id="a-newrel" style="margin:0 0 0 8px">+ new type</button></label>
    ${dropdownHTML('c-rel',[...rtypes.values()].map(t=>({value:t.name,label:t.name})),rel)}
    <label>Confidence</label>
    <div class="chips" id="c-conf" data-kind="conf">${confChips(conf)}</div>
    <label>Properties</label>
    <textarea id="f-props" placeholder="since: 2020"></textarea>
    <label>Source</label>
    <select id="f-source">${sourceOptions()}</select>
    <div class="row">
      <button class="btn" id="a-save">Create</button>
      <button class="btn ghost" id="a-cancel">Cancel</button>
    </div>`);

  wireDropdown('c-rel',v=>rel=v);
  wireChips('#c-conf',v=>conf=v);
  body.querySelector('#a-cancel').onclick=closeSheet;
  body.querySelector('#a-newrel').onclick=()=>openNewRel(()=>openLink(from,to));

  body.querySelector('#a-save').onclick=async()=>{
    try{
      const e=await req('/edges',{method:'POST',body:JSON.stringify({
        from:from.uid,to:to.uid,type:rel,confidence:conf,
        props:parseProps(body.querySelector('#f-props').value),
        source_uid:body.querySelector('#f-source').value||null,
      })});
      edges.push(e); closeSheet(); render(); setStatus();
    }catch(err){ toast('Link failed: '+err.message); }
  };
}

function openEdge(e){
  const a=byUid(e.from), b=byUid(e.to);
  let type=e.type, conf=e.confidence;
  openSheet(`
    <h2>Relationship</h2>
    <div class="sub">${esc(a?a.name:'?')} → ${esc(b?b.name:'?')}</div>
    <label>Type</label>
    ${dropdownHTML('c-rel',[...rtypes.values()].map(t=>({value:t.name,label:t.name})),type)}
    <label>Confidence</label>
    <div class="chips" id="c-conf" data-kind="conf">${confChips(conf)}</div>
    <label>Properties</label>
    <textarea id="f-props">${esc(printProps(e.props))}</textarea>
    <div class="row">
      <button class="btn" id="a-save">Save</button>
      <button class="btn danger" id="a-del">Delete</button>
    </div>
    <div class="mini">Added ${esc((e.added||'').slice(0,10))}</div>`);

  wireDropdown('c-rel',v=>type=v);
  wireChips('#c-conf',v=>conf=v);

  body.querySelector('#a-save').onclick=async()=>{
    try{
      let cur=e;
      // A type change is delete-and-recreate server side, so the
      // elementId changes and the local edge must be swapped out.
      if(type!==e.type){
        cur=await req(`/edges/${encodeURIComponent(e.id)}/type`,
          {method:'PUT',body:JSON.stringify({type})});
        edges=edges.filter(x=>x.id!==e.id);
        edges.push(cur);
      }
      const u=await req(`/edges/${encodeURIComponent(cur.id)}`,{method:'PATCH',
        body:JSON.stringify({confidence:conf,
          props:parseProps(body.querySelector('#f-props').value)})});
      const i=edges.findIndex(x=>x.id===u.id);
      if(i>=0) edges[i]=u;
      sel=null; closeSheet(); render(); setStatus();
    }catch(err){ toast('Save failed: '+err.message); }
  };

  body.querySelector('#a-del').onclick=async()=>{
    try{
      await req(`/edges/${encodeURIComponent(e.id)}`,{method:'DELETE'});
      edges=edges.filter(x=>x.id!==e.id);
      sel=null; closeSheet(); render(); setStatus();
    }catch(err){ toast('Delete failed: '+err.message); }
  };
}

// ---- new types ----
function openNewType(after){

    <input type="text" id="t-name" placeholder="e.g. Vessel">

// ---- path ----
async function findPath(from,to){
  try{
    const p=await req(`/graph/path?from=${from}&to=${to}`);
    if(!p.nodes.length){ toast('No path found within 6 hops'); render(); return; }
    mergeSub(p);
    // frame the path
    const ids=new Set(p.nodes.map(n=>n.uid));
    const pn=nodes.filter(n=>ids.has(n.uid));
    const xs=pn.map(n=>n.x), ys=pn.map(n=>n.y);
    const minX=Math.min(...xs)-100,maxX=Math.max(...xs)+100;
    const minY=Math.min(...ys)-100,maxY=Math.max(...ys)+100;
    cam.k=Math.min(svg.clientWidth/Math.max(maxX-minX,1),
                   svg.clientHeight/Math.max(maxY-minY,1),1.4);
    cam.x=svg.clientWidth/2-((minX+maxX)/2)*cam.k;
    cam.y=svg.clientHeight/2-((minY+maxY)/2)*cam.k;
    render(); setStatus();
    toast(`Path found: ${p.nodes.length} entities, ${p.edges.length} links`);
  }catch(e){ toast('Path search failed: '+e.message); }
}

// ---- menu ----
async function openMenu(){
  let stats={entities:0,relationships:0,sources:0,byType:[],hubs:[]};
  try{ stats=await req('/graph/stats'); }catch{}

  const typeToggles=[...etypes.values()].map(t=>{
    const n=(stats.byType.find(b=>b.type===t.name)||{}).count||0;
    const off=hidden.has(t.name);
    return `<button class="chip ${off?'':'on'}" data-t="${t.name}"
      style="border-color:${t.color}${off?'':`;background:${t.color}`}">${t.name} ${n}</button>`;
  }).join('');

  const hubs=stats.hubs.map(h=>
    `<div class="prop" style="cursor:pointer" data-uid="${h.uid}">
      <b>${h.degree}×</b> ${esc(h.name)} <span class="rtype">${esc(h.type)}</span></div>`).join('');

  openSheet(`
    <h2>Graph</h2>
    <div class="sub">${stats.entities} entities · ${stats.relationships} relationships · ${stats.sources} sources</div>

    <label>Show types</label>
    <div class="chips" id="c-vis">${typeToggles}</div>

    <label>Display</label>
    <div class="chips">
      <button class="chip ${showLabels?'on':''}" id="a-labels"
        style="border-color:var(--faint)${showLabels?';background:var(--faint);color:#e2e8f0':''}">Labels</button>
      ${focusUid?`<button class="chip on" id="a-clearfocus" style="border-color:var(--select);background:var(--select);color:#0f172a">Focus: ${focusDepth}° — clear</button>`:''}
      ${collapsed.size?`<button class="chip on" id="a-clearfold" style="border-color:var(--select);background:var(--select);color:#0f172a">${collapsed.size} collapsed — expand all</button>`:''}
    </div>

    <label>Most connected</label>
    ${hubs||'<div class="mini">Nothing yet</div>'}

    <div class="row">
      <button class="btn ghost small" id="a-reload">Reload graph</button>
      <button class="btn ghost small" id="a-sources">Sources</button>
    </div>
    <div class="row">
      <button class="btn ghost small" id="a-types">Manage types</button>
    </div>`);

  body.querySelectorAll('#c-vis .chip').forEach(c=>c.onclick=()=>{
    const t=c.dataset.t;
    if(hidden.has(t)){ hidden.delete(t); c.classList.add('on'); c.style.background=c.style.borderColor; }
    else{ hidden.add(t); c.classList.remove('on'); c.style.background='none'; }
    render(); setStatus();
  });

  body.querySelectorAll('.prop[data-uid]').forEach(d=>
    d.onclick=()=>{ closeSheet(); focusNode(d.dataset.uid); });

  body.querySelector('#a-labels').onclick=()=>{
    showLabels=!showLabels; render(); openMenu();
  };
  const clearFocusBtn=body.querySelector('#a-clearfocus');
  if(clearFocusBtn) clearFocusBtn.onclick=()=>{
    focusUid=null; focusDepth=0; render(); setStatus(); openMenu();
  };
  const clearFoldBtn=body.querySelector('#a-clearfold');
  if(clearFoldBtn) clearFoldBtn.onclick=()=>{
    collapsed.clear(); render(); setStatus(); openMenu();
  };

  body.querySelector('#a-reload').onclick=async()=>{ closeSheet(); await loadGraph(); };
  body.querySelector('#a-sources').onclick=openSources;
  body.querySelector('#a-types').onclick=openManageTypes;
}

async function openSources(){
  await loadSources();
  const list=sources.map(s=>
    `<div class="prop"><b>${esc(s.kind)}:</b> ${esc(s.label)}
      ${s.url?`<br><span class="rtype">${esc(s.url)}</span>`:''}</div>`).join('');
  openSheet(`
    <h2>Sources</h2>
    <div class="sub">Provenance for entities and links</div>
    ${list||'<div class="mini">No sources yet</div>'}
    <label>New source</label>
    <input type="text" id="s-label" placeholder="Label, e.g. Companies House 2024-03">
    <label>URL (optional)</label>
    <input type="text" id="s-url" placeholder="https://…">
    <label>Kind</label>
    <select id="s-kind">
      <option value="manual">manual</option>
      <option value="url">url</option>
      <option value="document">document</option>
      <option value="osint">osint</option>
      <option value="import">import</option>
    </select>
    <div class="row">
      <button class="btn" id="a-save">Add source</button>
      <button class="btn ghost" id="a-back">Back</button>
    </div>`);
  body.querySelector('#a-back').onclick=openMenu;
  body.querySelector('#a-save').onclick=async()=>{
    const label=body.querySelector('#s-label').value.trim();
    if(!label){ toast('Label required'); return; }
    try{
      await req('/sources',{method:'POST',body:JSON.stringify({
        label,url:body.querySelector('#s-url').value.trim()||null,
        kind:body.querySelector('#s-kind').value,
      })});
      await loadSources(); openSources();
    }catch(e){ toast('Failed: '+e.message); }
  };
}
